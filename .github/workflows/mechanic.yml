name: Build Sewfix Mechanic App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Extract Mechanic App
        run: |
          unzip -o Sewfix_Mechanic_App_FIXED.zip -d mechanic_project

      - name: Build Mechanic APK
        working-directory: mechanic_project/sewfix_android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          find mechanic_project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sewfix-Mechanic-Debug-APK
          path: mechanic_project/**/build/outputs/apk/debug/*.apk
